name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build Release
        run: |
          xcodebuild -scheme Bartidy \
            -configuration Release \
            -derivedDataPath build \
            build

      - name: Create DMG
        id: dmg
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          APP_PATH="build/Build/Products/Release/Bartidy.app"
          DMG_NAME="Bartidy-${VERSION}.dmg"
          
          hdiutil create -volname "Bartidy" \
            -srcfolder "$APP_PATH" \
            -ov -format UDZO \
            "$DMG_NAME"
          
          SHA256=$(shasum -a 256 "$DMG_NAME" | awk '{print $1}')
          
          echo "dmg_name=$DMG_NAME" >> $GITHUB_OUTPUT
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.dmg.outputs.dmg_name }}
          generate_release_notes: true

      - name: Update Cask Formula
        run: |
          VERSION=${{ steps.dmg.outputs.version }}
          SHA256=${{ steps.dmg.outputs.sha256 }}
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          
          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" Casks/bartidy.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"${SHA256}\"/" Casks/bartidy.rb
          
          git add Casks/bartidy.rb
          git commit -m "chore: update cask to v${VERSION}"
          git push origin main
