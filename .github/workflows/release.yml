name: Release

# Triggered by:
#   - pushing a `v*` tag (production release)
#   - manual workflow_dispatch (for re-runs and testing)
#
# Produces a Developer ID-signed, Apple-notarized DMG and updates
# appcast.xml + Casks/bartidy.rb on main. Mirrors scripts/release.sh.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.4.1)'
        required: true

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Setup signing keychain
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -e
          KEYCHAIN_PASSWORD=$(uuidgen)
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # Add to keychain search list so codesign can find the identity
          ORIGINAL=$(security list-keychains -d user | sed -e 's/^[[:space:]]*//' | tr -d '"')
          security list-keychains -d user -s "$KEYCHAIN" $ORIGINAL

          # Import Developer ID Application certificate
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
              -P "$CERT_PASSWORD" \
              -A -t cert -f pkcs12 \
              -k "$KEYCHAIN"
          security set-key-partition-list \
              -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"

          # Store notarytool credentials in the same keychain
          xcrun notarytool store-credentials "bartidy-notary" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --keychain "$KEYCHAIN"

          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Setup Sparkle tools and EdDSA private key
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p .sparkle
          curl -sL https://github.com/sparkle-project/Sparkle/releases/download/2.9.1/Sparkle-2.9.1.tar.xz \
              | tar -xJ -C .sparkle
          # Write key to file; release.sh reads it via SPARKLE_PRIVATE_KEY_FILE
          # to avoid keychain prompts on CI runners.
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/eddsa.key"
          chmod 600 "$RUNNER_TEMP/eddsa.key"

      - name: Run release pipeline
        env:
          SPARKLE_PRIVATE_KEY_FILE: ${{ runner.temp }}/eddsa.key
        run: ./scripts/release.sh "${{ steps.version.outputs.version }}"

      - name: Update Cask formula
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          SHA256=$(shasum -a 256 "release/Bartidy-${VERSION}.dmg" | awk '{print $1}')
          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" Casks/bartidy.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"${SHA256}\"/" Casks/bartidy.rb

      - name: Commit appcast + cask back to main
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet appcast.xml Casks/bartidy.rb; then
            echo "No changes to commit"
          else
            git add appcast.xml Casks/bartidy.rb
            git commit -m "release: v${VERSION} (auto)"
            git push origin main
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          # If release already exists (e.g. tag pre-created), upload the DMG to it.
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "release/Bartidy-${VERSION}.dmg" --clobber
          else
            gh release create "v${VERSION}" \
                "release/Bartidy-${VERSION}.dmg" \
                --title "v${VERSION}" \
                --generate-notes
          fi
